<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kočāns Miķelis</title>
    <link rel="icon" type="image/x-icon" href="textures/kocans_light.ico">
    <link rel="icon" type="image/x-icon" href="textures/kocans_light.ico" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/x-icon" href="textures/kocans_dark.ico" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital@1&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="list">
        <a href="portfolio.html" aria-label="Open portfolio" title="uz dizaina portfolio">
            <img id="list-logo" src="textures/wall-art-title.webp" alt="Kocans logo" draggable="false">
        </a>
        <a class="list-line" data-alt="13.08. Rīga............ Lastādija">13.08. Rīga, Lastādija.............................. info sekos</a>
        <a class="list-line" data-alt="15.08. Liepa.... Veidenfests 2026">15.08. Liepa, Veidenfests 2026, Kalāči............... par velti</a>
        <div id="social-links">
            <a class="social-link" href="https://kocans.bandcamp.com/" aria-label="Bandcamp">
                <img src="textures/bandcamp.svg" alt="Bandcamp" draggable="false">
            </a>
            <a class="social-link" href="https://open.spotify.com/artist/3iikatk6TEi5SvlRjwpf7l?si=S2daZXyTS-GeTQkn2-Uy4g" aria-label="Spotify">
                <img src="textures/spotify.svg" alt="Spotify" draggable="false">
            </a>
            <a class="social-link" href="https://music.apple.com/us/artist/ko%C4%8D%C4%81ns-mi%C4%B7elis/1704089359" aria-label="Apple Music">
                <img src="textures/apple_music.svg" alt="Apple Music" draggable="false">
            </a>
            <a class="social-link" href="https://www.youtube.com/@ezissoniks" aria-label="YouTube">
                <img src="textures/youtube.svg" alt="YouTube" draggable="false">
            </a>
            <a class="social-link" href="https://www.instagram.com/ezissoniks/" aria-label="Instagram">
                <img src="textures/instagram.svg" alt="Instagram" draggable="false">
            </a>
            <a class="social-link" href="https://www.tiktok.com/@ezissoniks" aria-label="TikTok">
                <img src="textures/tiktok.svg" alt="TikTok" draggable="false">
            </a>
        </div>
    </div>
    <script>
        (() => {
            const FADE_MS = 450;
            const portfolioLink = document.querySelector('a[aria-label="Open portfolio"]');

            requestAnimationFrame(() => document.body.classList.add('loaded'));

            if (!portfolioLink) return;

            portfolioLink.addEventListener('click', event => {
                if (event.defaultPrevented || event.button !== 0) return;
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

                event.preventDefault();
                const targetHref = portfolioLink.getAttribute('href');
                if (!targetHref) return;

                document.body.classList.remove('loaded');
                setTimeout(() => {
                    window.location.href = targetHref;
                }, FADE_MS);
            });
        })();
    </script>
</body>
</html>
